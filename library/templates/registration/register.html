{% extends 'base.html' %}


{% block title %}
    Register | Digital Library
{% endblock %}


{% block content %}

    <section class="form-container">

        <h1>
            Create account
        </h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">
                Register
            </button>

        </form>


        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </section>

{% endblock %}
