{% extends 'base.html' %}


{% block title %}
    Login | Digital Library
{% endblock %}


{% block content %}

    <section class="form-container">

        <h1>
            Login
        </h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">
                Login
            </button>

        </form>


        <p>
            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </section>

{% endblock %}
